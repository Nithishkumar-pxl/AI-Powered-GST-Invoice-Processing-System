# ============================================================
# docker-compose.yml — Quick PostgreSQL setup for development
# Usage: docker-compose up -d
# ============================================================

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gstract_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       invoice_gst_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gstract_pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  gstract_pgdata:
